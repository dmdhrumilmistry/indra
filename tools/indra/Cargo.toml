[package]
name = "indra"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "One CLI for AI agent harnesses: graph memory (Markdown notes with typed links, Obsidian-compatible) and a local web console to view, monitor and run agents."
license = "MIT"
repository = "https://github.com/dmdhrumilmistry/indra"
readme = "README.md"
keywords = ["ai-agents", "knowledge-graph", "memory", "obsidian", "claude-code"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
axum = "0.8"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "net", "signal", "fs"] }
toml = "1"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
