name: tools

# Tests the Rust tools in tools/ (memex, agentdeck) on Linux, macOS and
# Windows. A `memex-v*` or `agentdeck-v*` tag publishes that tool's prebuilt
# binaries to a GitHub release.
#
# No third-party actions: the runners already ship rustup, and `gh` uploads the
# release assets, so the only code that runs here is this repository's.

on:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/tools.yml"]
    tags: ["memex-v*", "agentdeck-v*"]
  pull_request:
    paths: ["tools/**", ".github/workflows/tools.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tools-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash
    working-directory: tools

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace

  release:
    name: release (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/memex-v') || startsWith(github.ref, 'refs/tags/agentdeck-v')
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: .exe }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: musl tools
        if: matrix.musl
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: Build
        id: build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bin="${TAG%%-v*}"   # memex-v0.1.0 -> memex
          cargo build --locked --release -p "$bin" --target ${{ matrix.target }}
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Package
        id: pkg
        env:
          BIN: ${{ steps.build.outputs.bin }}
        run: |
          name="$BIN-${{ matrix.target }}${{ matrix.exe }}"
          cp "target/${{ matrix.target }}/release/$BIN${{ matrix.exe }}" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name" > "$name.sha256"; else shasum -a 256 "$name" > "$name.sha256"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.pkg.outputs.name }}
        run: |
          # Every matrix job races to create the release; losing that race is fine.
          export GH_REPO="$GITHUB_REPOSITORY"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --notes "Prebuilt binaries. See tools/README.md." \
            || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" "$NAME" "$NAME.sha256" --clobber
