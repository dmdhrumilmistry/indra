name: pages

# Publishes the project site to GitHub Pages at
# https://dmdhrumilmistry.github.io/indra/: the landing page (site/), the brand
# assets (assets/), and the documentation pages, rendered from the repository's
# Markdown by `indra dev site` (pages listed in site/pages.toml). Pull requests
# are checked by pages-check.yml, which builds the site without deploying it.
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# Only GitHub's own actions are used.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - "docs/**"
      - "README.md"
      - "tools/indra/README.md"
      - "tools/indra/src/site.rs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy at a time.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the site and the docs
        # The runners ship rustup; the site builder is part of the indra binary.
        run: cargo run --locked --quiet --no-default-features --manifest-path tools/indra/Cargo.toml -- dev site --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
