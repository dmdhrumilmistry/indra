name: pages

# Publishes the project site to GitHub Pages at
# https://dmdhrumilmistry.github.io/indra/: the landing page (site/), the brand
# assets (assets/), and the documentation pages, rendered from the repository's
# Markdown by scripts/build-site.py. Pull requests build the site (and fail on
# broken links) without deploying it.
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# Only GitHub's own actions are used.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - "docs/**"
      - "README.md"
      - "tools/indra/README.md"
      - "scripts/build-site.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "assets/**"
      - "docs/**"
      - "README.md"
      - "tools/indra/README.md"
      - "scripts/build-site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy at a time; a pull request's check build runs on its own.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the site and the docs
        run: python3 scripts/build-site.py --out _site
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
