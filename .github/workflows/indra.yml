name: indra

# Tests the indra CLI (tools/indra) on Linux, macOS and Windows: format,
# clippy and the test suite, on every pull request and push to main that
# touches it. Releases are release.yml.
#
# No third-party actions: the runners already ship rustup.

on:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/indra.yml"]
  pull_request:
    paths: ["tools/**", ".github/workflows/indra.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indra-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: tools/indra

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

